<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  * { box-sizing: border-box; }
  body { width: 300px; margin: 0; padding: 18px; background: #0b0b0f; color: #f4f4f5; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .logo { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, #7c5cff, #b39dff); display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #fff; }
  h1 { font-size: 17px; margin: 0; letter-spacing: 0.18em; }
  .sub { margin: 6px 0 16px; font-size: 12px; color: #a1a1aa; }
  .card { display: block; width: 100%; margin-bottom: 8px; padding: 12px 14px; border: 1px solid rgba(255,255,255,.06); border-radius: 14px; background: #16161d; color: inherit; text-align: left; cursor: pointer; transition: border-color .2s, transform .2s, background .2s; }
  .card:hover { border-color: #7c5cff; transform: translateY(-1px); }
  .card b { display: block; font-size: 14px; font-weight: 600; }
  .card span { display: block; margin-top: 2px; font-size: 12px; color: #a1a1aa; }
  .card.active { border-color: #7c5cff; background: rgba(124,92,255,.14); }
  .ghost { width: 100%; margin-top: 4px; padding: 10px; border: 0; border-radius: 12px; background: transparent; color: #a1a1aa; font-size: 13px; cursor: pointer; }
  .ghost:hover { color: #fff; }
  #out { margin-top: 10px; min-height: 16px; font-size: 12px; color: #a1a1aa; text-align: center; }
  button:disabled { opacity: .5; cursor: wait; }
</style>
</head>
<body>
  <div class="head"><div class="logo">M</div><h1>MORPH</h1></div>
  <p class="sub">This portfolio, rearranged for you.</p>
  <button class="card" data-p="recruiter"><b>I'm hiring</b><span>Skills, projects, experience first</span></button>
  <button class="card" data-p="client"><b>I need a freelancer</b><span>Services, proof, contact first</span></button>
  <button class="card" data-p="designer"><b>I'm a designer</b><span>Case studies and craft first</span></button>
  <button class="ghost" data-p="reset">Show original</button>
  <div id="out"></div>
  <script src="popup.js"></script>
</body>
</html>
