<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  body { width: 250px; margin: 0; padding: 16px; background: #0b0b0f; color: #f4f4f5; font-family: system-ui, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 4px; letter-spacing: 2px; }
  p { margin: 0 0 12px; font-size: 12px; color: #a1a1aa; }
  button { display: block; width: 100%; margin-bottom: 8px; padding: 10px; border: 0; border-radius: 10px; background: #16161d; color: #f4f4f5; font-size: 14px; cursor: pointer; }
  button:hover { background: #7c5cff; }
  #out { margin-top: 8px; font-size: 12px; color: #a1a1aa; min-height: 16px; }
</style>
</head>
<body>
  <h1>MORPH</h1>
  <p>Who are you on this portfolio?</p>
  <button data-p="recruiter">I'm hiring</button>
  <button data-p="client">I need a freelancer</button>
  <button data-p="designer">I'm a designer</button>
  <button data-p="reset">Show original</button>
  <div id="out"></div>
  <script src="popup.js"></script>
</body>
</html>
